<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat con IA</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --user: #0a66c2;
      --user-text: #ffffff;
      --ai: #e9e9ee;
      --error: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --panel: #2c2c2e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: #3a3a3c;
        --ai: #3a3a3c;
        --error: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--user);
      color: var(--user-text);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
    }
    .hidden { display: none !important; }

    /* Pantalla de contraseña */
    #login {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #login form {
      background: var(--panel);
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    #login h1 { margin: 0 0 8px; font-size: 1.4rem; text-align: center; }
    #login input {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    .error { color: var(--error); font-size: 0.9rem; min-height: 1.2em; margin: 0; }

    /* Pantalla de chat */
    #chat {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    header .actions { display: flex; gap: 8px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty { color: var(--muted); text-align: center; margin: auto; }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.45;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--ai);
      border-bottom-left-radius: 4px;
    }
    .msg.error-msg {
      align-self: flex-start;
      color: var(--error);
      background: transparent;
      border: 1px solid var(--error);
    }
    .typing::after {
      content: "▍";
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
    }
    #input {
      flex: 1;
      font: inherit;
      resize: none;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      max-height: 200px;
    }
  </style>
</head>
<body>
  <!-- Pantalla de contraseña -->
  <div id="login" class="hidden">
    <form id="login-form">
      <h1>🔒 Chat con IA</h1>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus />
      <button type="submit">Entrar</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <!-- Pantalla de chat -->
  <div id="chat" class="hidden">
    <header>
      <h1>Chat con IA</h1>
      <div class="actions">
        <button id="new-chat" class="secondary" type="button">Nueva conversación</button>
        <button id="logout" class="secondary" type="button">Salir</button>
      </div>
    </header>
    <main id="messages">
      <p class="empty" id="empty">Escribe un mensaje para empezar.</p>
    </main>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Escribe tu mensaje… (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const loginView = $("login");
    const chatView = $("chat");
    const messagesEl = $("messages");
    const input = $("input");
    const sendBtn = $("send");

    // Historial de la conversación (solo en esta pestaña)
    let history = [];
    let busy = false;

    function showLogin() {
      chatView.classList.add("hidden");
      loginView.classList.remove("hidden");
      $("password").value = "";
      $("password").focus();
    }

    function showChat() {
      loginView.classList.add("hidden");
      chatView.classList.remove("hidden");
      input.focus();
    }

    function addBubble(role, text) {
      $("empty")?.remove();
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = '<p class="empty" id="empty">Escribe un mensaje para empezar.</p>';
      input.focus();
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      $("new-chat").disabled = value;
    }

    // --- Inicio: comprobar si ya hay sesión ---
    fetch("/api/session")
      .then((r) => r.json())
      .then((data) => (data.authenticated ? showChat() : showLogin()))
      .catch(showLogin);

    // --- Contraseña ---
    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("login-error").textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: $("password").value }),
        });
        if (res.ok) return showChat();
        const data = await res.json().catch(() => ({}));
        $("login-error").textContent = data.error || "Error al entrar";
      } catch {
        $("login-error").textContent = "No se pudo conectar con el servidor";
      }
    });

    $("logout").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      resetChat();
      showLogin();
    });

    $("new-chat").addEventListener("click", resetChat);

    // --- Caja de texto ---
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $("composer").requestSubmit();
      }
    });

    // --- Enviar mensaje y mostrar la respuesta en vivo ---
    $("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;

      input.value = "";
      input.style.height = "auto";
      addBubble("user", text);
      history.push({ role: "user", content: text });
      setBusy(true);

      const bubble = addBubble("assistant", "");
      bubble.classList.add("typing");
      let answer = "";
      let errorText = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });

        if (res.status === 401) {
          history.pop();
          bubble.remove();
          setBusy(false);
          return showLogin();
        }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "Error del servidor");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.type === "text") {
              answer += event.text;
              bubble.textContent = answer;
              scrollToBottom();
            } else if (event.type === "error") {
              errorText = event.error;
            }
          }
        }
      } catch (err) {
        errorText = err.message || "Error de conexión";
      }

      bubble.classList.remove("typing");
      if (answer && !errorText) {
        history.push({ role: "assistant", content: answer });
      } else {
        // Si falló, quitamos el mensaje del historial para poder reintentarlo
        if (!answer) bubble.remove();
        history.pop();
        addBubble("error-msg", (errorText || "Sin respuesta") + " (tu mensaje no se guardó, puedes reenviarlo)");
        input.value = text;
      }
      setBusy(false);
      input.focus();
    });
  </script>
</body>
</html>
