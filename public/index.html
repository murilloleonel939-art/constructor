<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat con IA</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --user: #0a66c2;
      --user-text: #ffffff;
      --ai: #e9e9ee;
      --error: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --panel: #2c2c2e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: #3a3a3c;
        --ai: #3a3a3c;
        --error: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--user);
      color: var(--user-text);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
    }
    .hidden { display: none !important; }

    /* Pantalla de contraseña */
    #login {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #login form {
      background: var(--panel);
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    #login h1 { margin: 0 0 8px; font-size: 1.4rem; text-align: center; }
    #login input {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    .error { color: var(--error); font-size: 0.9rem; min-height: 1.2em; margin: 0; }

    /* Pantalla de chat: barra lateral + conversación */
    #chat { height: 100%; display: flex; }
    aside {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
    }
    aside .top { padding: 12px; border-bottom: 1px solid var(--border); }
    aside .top button { width: 100%; }
    #list { flex: 1; overflow-y: auto; padding: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .item:hover { background: var(--bg); }
    .item.active { background: var(--ai); }
    .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .del {
      background: transparent;
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .item .del:hover { color: var(--error); }
    .list-empty { color: var(--muted); text-align: center; font-size: 0.9rem; padding: 12px; }

    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; width: 100%; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    header .actions { display: flex; gap: 8px; }
    #toggle-list { display: none; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty { color: var(--muted); text-align: center; margin: auto; }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.45;
    }
    .msg img { display: block; max-width: 220px; max-height: 220px; border-radius: 8px; margin-bottom: 6px; }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--ai);
      border-bottom-left-radius: 4px;
    }
    .msg.error-msg {
      align-self: flex-start;
      color: var(--error);
      background: transparent;
      border: 1px solid var(--error);
    }
    .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    #previews { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 16px 0; }
    .prev { position: relative; }
    .prev img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .prev button {
      position: absolute; top: -6px; right: -6px;
      width: 20px; height: 20px; padding: 0; border-radius: 50%;
      font-size: 12px; line-height: 20px; background: var(--error);
    }
    #composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      font: inherit;
      resize: none;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      max-height: 200px;
    }
    #attach { padding: 10px 12px; }

    @media (max-width: 720px) {
      aside {
        position: fixed; top: 0; bottom: 0; left: 0; z-index: 10;
        transform: translateX(-100%); transition: transform 0.2s;
      }
      aside.open { transform: translateX(0); box-shadow: 0 0 24px rgba(0,0,0,0.3); }
      #toggle-list { display: inline-block; }
    }
  </style>
</head>
<body>
  <!-- Pantalla de contraseña -->
  <div id="login" class="hidden">
    <form id="login-form">
      <h1>🔒 Chat con IA</h1>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus />
      <button type="submit">Entrar</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <!-- Pantalla de chat -->
  <div id="chat" class="hidden">
    <aside id="side">
      <div class="top"><button id="new-chat" type="button">+ Nueva conversación</button></div>
      <div id="list"></div>
    </aside>
    <div id="main">
      <header>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="toggle-list" class="secondary" type="button">☰</button>
          <h1>Chat con IA</h1>
        </div>
        <div class="actions">
          <button id="logout" class="secondary" type="button">Salir</button>
        </div>
      </header>
      <main id="messages">
        <p class="empty" id="empty">Escribe un mensaje para empezar.</p>
      </main>
      <div id="previews" class="hidden"></div>
      <form id="composer">
        <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple class="hidden" />
        <button id="attach" class="secondary" type="button" title="Adjuntar imagen">📎</button>
        <textarea id="input" rows="1" placeholder="Escribe tu mensaje… (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
        <button id="send" type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const loginView = $("login");
    const chatView = $("chat");
    const messagesEl = $("messages");
    const input = $("input");
    const sendBtn = $("send");

    const MAX_IMAGES = 5;
    const MAX_FILE_BYTES = 5 * 1024 * 1024;

    let history = [];
    let currentId = crypto.randomUUID();
    let pending = []; // imágenes por enviar: { media_type, data }
    let busy = false;

    function showLogin() {
      chatView.classList.add("hidden");
      loginView.classList.remove("hidden");
      $("password").value = "";
      $("password").focus();
    }

    function showChat() {
      loginView.classList.add("hidden");
      chatView.classList.remove("hidden");
      loadList();
      input.focus();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Crea una burbuja. content puede ser texto o una lista de bloques (texto/imagen)
    function addBubble(role, content) {
      $("empty")?.remove();
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (typeof content === "string") {
        div.textContent = content;
      } else {
        for (const b of content) {
          if (b.type === "image") {
            const img = document.createElement("img");
            img.src = `data:${b.source.media_type};base64,${b.source.data}`;
            div.appendChild(img);
          } else if (b.type === "text") {
            div.appendChild(document.createTextNode(b.text));
          }
        }
      }
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function countImages(msgs) {
      let n = 0;
      for (const m of msgs) {
        if (Array.isArray(m.content)) n += m.content.filter((b) => b.type === "image").length;
      }
      return n;
    }

    // --- Lista de conversaciones guardadas ---
    async function loadList() {
      try {
        const res = await fetch("/api/conversations");
        if (res.status === 401) return showLogin();
        const items = await res.json();
        const list = $("list");
        list.innerHTML = "";
        if (!items.length) {
          list.innerHTML = '<p class="list-empty">Aún no hay conversaciones guardadas.</p>';
          return;
        }
        for (const c of items) {
          const row = document.createElement("div");
          row.className = "item" + (c.id === currentId ? " active" : "");
          const t = document.createElement("span");
          t.className = "t";
          t.textContent = c.title;
          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "🗑";
          del.title = "Borrar";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteConversation(c.id);
          });
          row.addEventListener("click", () => openConversation(c.id));
          row.append(t, del);
          list.appendChild(row);
        }
      } catch {}
    }

    async function openConversation(id) {
      if (busy) return;
      try {
        const res = await fetch("/api/conversations/" + id);
        if (res.status === 401) return showLogin();
        if (!res.ok) return;
        const data = await res.json();
        currentId = data.id;
        history = data.messages;
        pending = [];
        renderPreviews();
        messagesEl.innerHTML = "";
        for (const m of history) addBubble(m.role, m.content);
        $("side").classList.remove("open");
        loadList();
        input.focus();
      } catch {}
    }

    async function deleteConversation(id) {
      if (busy) return;
      if (!confirm("¿Borrar esta conversación? No se puede deshacer.")) return;
      await fetch("/api/conversations/" + id, { method: "DELETE" });
      if (id === currentId) resetChat();
      loadList();
    }

    function resetChat() {
      history = [];
      pending = [];
      currentId = crypto.randomUUID();
      renderPreviews();
      messagesEl.innerHTML = '<p class="empty" id="empty">Escribe un mensaje para empezar.</p>';
      $("side").classList.remove("open");
      loadList();
      input.focus();
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      $("new-chat").disabled = value;
    }

    // --- Imágenes ---
    function renderPreviews() {
      const box = $("previews");
      box.innerHTML = "";
      box.classList.toggle("hidden", pending.length === 0);
      pending.forEach((p, i) => {
        const wrap = document.createElement("div");
        wrap.className = "prev";
        const img = document.createElement("img");
        img.src = `data:${p.media_type};base64,${p.data}`;
        const x = document.createElement("button");
        x.type = "button";
        x.textContent = "✕";
        x.addEventListener("click", () => {
          pending.splice(i, 1);
          renderPreviews();
        });
        wrap.append(img, x);
        box.appendChild(wrap);
      });
    }

    function readFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const [head, data] = String(reader.result).split(",");
          resolve({ media_type: head.match(/data:(.*?);/)[1], data });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    $("attach").addEventListener("click", () => $("file").click());
    $("file").addEventListener("change", async (e) => {
      for (const file of e.target.files) {
        if (countImages(history) + pending.length >= MAX_IMAGES) {
          alert(`Máximo ${MAX_IMAGES} imágenes por conversación. Empieza una conversación nueva para más.`);
          break;
        }
        if (file.size > MAX_FILE_BYTES) {
          alert(`"${file.name}" supera 5 MB.`);
          continue;
        }
        pending.push(await readFile(file));
      }
      e.target.value = "";
      renderPreviews();
    });

    // --- Inicio: comprobar si ya hay sesión ---
    fetch("/api/session")
      .then((r) => r.json())
      .then((data) => (data.authenticated ? showChat() : showLogin()))
      .catch(showLogin);

    // --- Contraseña ---
    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("login-error").textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: $("password").value }),
        });
        if (res.ok) return showChat();
        const data = await res.json().catch(() => ({}));
        $("login-error").textContent = data.error || "Error al entrar";
      } catch {
        $("login-error").textContent = "No se pudo conectar con el servidor";
      }
    });

    $("logout").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      resetChat();
      showLogin();
    });

    $("new-chat").addEventListener("click", resetChat);
    $("toggle-list").addEventListener("click", () => $("side").classList.toggle("open"));

    // --- Caja de texto ---
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $("composer").requestSubmit();
      }
    });

    // --- Enviar mensaje y mostrar la respuesta en vivo ---
    $("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if ((!text && pending.length === 0) || busy) return;

      const sentImages = pending;
      let content = text;
      if (sentImages.length) {
        content = sentImages.map((p) => ({
          type: "image",
          source: { type: "base64", media_type: p.media_type, data: p.data },
        }));
        if (text) content.push({ type: "text", text });
      }

      input.value = "";
      input.style.height = "auto";
      pending = [];
      renderPreviews();
      addBubble("user", content);
      history.push({ role: "user", content });
      setBusy(true);

      const bubble = addBubble("assistant", "");
      bubble.classList.add("typing");
      let answer = "";
      let errorText = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: currentId, messages: history }),
        });

        if (res.status === 401) {
          history.pop();
          bubble.remove();
          setBusy(false);
          return showLogin();
        }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "Error del servidor");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.type === "text") {
              answer += event.text;
              bubble.textContent = answer;
              scrollToBottom();
            } else if (event.type === "error") {
              errorText = event.error;
            }
          }
        }
      } catch (err) {
        errorText = err.message || "Error de conexión";
      }

      bubble.classList.remove("typing");
      if (answer && !errorText) {
        history.push({ role: "assistant", content: answer });
        loadList();
      } else {
        // Si falló, quitamos el mensaje del historial para poder reintentarlo
        if (!answer) bubble.remove();
        history.pop();
        addBubble("error-msg", (errorText || "Sin respuesta") + " (tu mensaje no se guardó, puedes reenviarlo)");
        input.value = text;
        pending = sentImages;
        renderPreviews();
      }
      setBusy(false);
      input.focus();
    });
  </script>
</body>
</html>
