<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat con IA</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --user: #0a66c2;
      --user-text: #ffffff;
      --ai: #e9e9ee;
      --error: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --panel: #2c2c2e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: #3a3a3c;
        --ai: #3a3a3c;
        --error: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--user);
      color: var(--user-text);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
    }
    .hidden { display: none !important; }

    /* Pantalla de contraseña */
    #login {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #login form {
      background: var(--panel);
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    #login h1 { margin: 0 0 8px; font-size: 1.4rem; text-align: center; }
    #login input {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    .error { color: var(--error); font-size: 0.9rem; min-height: 1.2em; margin: 0; }

    /* Pantalla de chat: barra lateral + conversación */
    #chat { height: 100%; display: flex; }
    aside {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
    }
    aside .top { padding: 12px; border-bottom: 1px solid var(--border); }
    aside .top button { width: 100%; }
    #list { flex: 1; overflow-y: auto; padding: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .item:hover { background: var(--bg); }
    .item.active { background: var(--ai); }
    .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .del {
      background: transparent;
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .item .del:hover { color: var(--error); }
    .list-empty { color: var(--muted); text-align: center; font-size: 0.9rem; padding: 12px; }

    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; width: 100%; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    header .actions { display: flex; gap: 8px; }
    .badge { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    #toggle-list { display: none; }

    /* Panel del proyecto de GitHub */
    #proj-panel {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    #proj-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #proj-form input {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      min-width: 0;
    }
    #proj-repo { flex: 2 1 180px; }
    #proj-branch { flex: 1 1 90px; }
    #proj-token { flex: 2 1 220px; }
    #proj-form button { padding: 8px 14px; }
    .proj-help { color: var(--muted); font-size: 0.82rem; margin: 8px 0 0; line-height: 1.4; }
    #proj-msg { margin-top: 6px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty { color: var(--muted); text-align: center; margin: auto; }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.45;
    }
    .msg img { display: block; max-width: 220px; max-height: 220px; border-radius: 8px; margin-bottom: 6px; }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--ai);
      border-bottom-left-radius: 4px;
    }
    .msg.error-msg {
      align-self: flex-start;
      color: var(--error);
      background: transparent;
      border: 1px solid var(--error);
    }
    .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }

    /* Tarjeta de confirmación de commits */
    .confirm-card {
      align-self: flex-start;
      max-width: 95%;
      border: 1px solid var(--user);
      background: var(--panel);
      border-radius: 12px;
      padding: 12px 14px;
      line-height: 1.4;
    }
    .confirm-commit { color: var(--muted); font-size: 0.88rem; margin: 4px 0 8px; }
    .confirm-label { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
    .confirm-card pre {
      margin: 4px 0 0;
      padding: 8px;
      background: var(--bg);
      border-radius: 8px;
      font-size: 0.82rem;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .confirm-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .confirm-actions button { padding: 8px 14px; }
    .confirm-status { font-size: 0.9rem; color: var(--muted); }
    @keyframes blink { 50% { opacity: 0; } }

    /* Aviso de conversación cerca del límite */
    #limit-warn {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 16px 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 0.85rem;
    }
    #limit-warn.danger { border-color: var(--error); color: var(--error); }
    #limit-warn button { padding: 4px 10px; font-size: 0.85rem; }

    #previews { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 16px 0; }
    .prev { position: relative; }
    .prev img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .prev button {
      position: absolute; top: -6px; right: -6px;
      width: 20px; height: 20px; padding: 0; border-radius: 50%;
      font-size: 12px; line-height: 20px; background: var(--error);
    }
    #composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      font: inherit;
      resize: none;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      max-height: 200px;
    }
    #attach { padding: 10px 12px; }

    @media (max-width: 720px) {
      aside {
        position: fixed; top: 0; bottom: 0; left: 0; z-index: 10;
        transform: translateX(-100%); transition: transform 0.2s;
      }
      aside.open { transform: translateX(0); box-shadow: 0 0 24px rgba(0,0,0,0.3); }
      #toggle-list { display: inline-block; }
    }
  </style>
</head>
<body>
  <!-- Pantalla de contraseña -->
  <div id="login" class="hidden">
    <form id="login-form">
      <h1>🔒 Chat con IA</h1>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus />
      <button type="submit">Entrar</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <!-- Pantalla de chat -->
  <div id="chat" class="hidden">
    <aside id="side">
      <div class="top"><button id="new-chat" type="button">+ Nueva conversación</button></div>
      <div id="list"></div>
    </aside>
    <div id="main">
      <header>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="toggle-list" class="secondary" type="button">☰</button>
          <div>
            <h1>Chat con IA</h1>
            <div id="proj-badge" class="badge">Sin proyecto</div>
          </div>
        </div>
        <div class="actions">
          <select id="model-select" title="Modelo" style="font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);max-width:170px"></select>
          <button id="proj-toggle" class="secondary" type="button">🔗 Proyecto</button>
          <button id="logout" class="secondary" type="button">Salir</button>
        </div>
      </header>

      <!-- Panel para vincular esta conversación a un repo de GitHub -->
      <div id="proj-panel" class="hidden">
        <form id="proj-form">
          <input id="proj-repo" type="text" placeholder="dueño/repositorio" autocomplete="off" required />
          <input id="proj-branch" type="text" placeholder="rama" value="main" autocomplete="off" />
          <input id="proj-token" type="password" placeholder="Token de GitHub" autocomplete="off" />
          <button type="submit">Guardar</button>
          <button id="proj-unlink" class="secondary" type="button">Desvincular</button>
        </form>
        <p class="proj-help">
          Usa un token fine-grained limitado a este repo, con permiso <b>Contents: lectura y escritura</b>.
          Si ya hay uno guardado, puedes dejar el campo del token vacío para conservarlo.
        </p>
        <p id="proj-msg" class="error"></p>
      </div>

      <main id="messages">
        <p class="empty" id="empty">Escribe un mensaje para empezar.</p>
      </main>
      <div id="limit-warn" class="hidden"></div>
      <div id="previews" class="hidden"></div>
      <form id="composer">
        <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple class="hidden" />
        <button id="attach" class="secondary" type="button" title="Adjuntar imagen">📎</button>
        <textarea id="input" rows="1" placeholder="Escribe tu mensaje… (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
        <button id="send" type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const loginView = $("login");
    const chatView = $("chat");
    const messagesEl = $("messages");
    const input = $("input");
    const sendBtn = $("send");

    const MAX_IMAGES = 5;
    const MAX_FILE_BYTES = 5 * 1024 * 1024;

    let history = [];
    let currentId = crypto.randomUUID();
    let pending = []; // imágenes por enviar: { media_type, data }
    let busy = false;
    let project = null; // { repo, branch } de la conversación actual
    let model = localStorage.getItem("model") || ""; // modelo elegido (vacío = el del servidor)

    // --- Selector de modelo ---
    async function loadModels() {
      try {
        const res = await fetch("/api/models");
        if (res.status === 401) return showLogin();
        if (!res.ok) return;
        const data = await res.json();
        const sel = $("model-select");
        sel.innerHTML = "";
        for (const m of data.models) {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          sel.appendChild(opt);
        }
        // Restaurar el modelo guardado en localStorage, o usar el del servidor
        const saved = localStorage.getItem("model");
        model = data.models.includes(saved) ? saved : data.default;
        sel.value = model;
        localStorage.setItem("model", model);
      } catch {}
    }
    $("model-select").addEventListener("change", (e) => {
      model = e.target.value;
      localStorage.setItem("model", model);
      console.log("Modelo seleccionado:", model);
    });

    function showLogin() {
      chatView.classList.add("hidden");
      loginView.classList.remove("hidden");
      $("password").value = "";
      $("password").focus();
    }

    function showChat() {
      loginView.classList.add("hidden");
      chatView.classList.remove("hidden");
      loadModels();
      loadList();
      loadProject();
      input.focus();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Crea una burbuja. content puede ser texto o una lista de bloques (texto/imagen)
    function addBubble(role, content) {
      $("empty")?.remove();
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (typeof content === "string") {
        div.textContent = content;
      } else {
        for (const b of content) {
          if (b.type === "image") {
            const img = document.createElement("img");
            img.src = `data:${b.source.media_type};base64,${b.source.data}`;
            div.appendChild(img);
          } else if (b.type === "text") {
            div.appendChild(document.createTextNode(b.text));
          }
        }
      }
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function countImages(msgs) {
      let n = 0;
      for (const m of msgs) {
        if (Array.isArray(m.content)) n += m.content.filter((b) => b.type === "image").length;
      }
      return n;
    }

    // --- Proyecto de GitHub de la conversación ---
    function renderProject() {
      $("proj-badge").textContent = project?.repo
        ? `🔗 ${project.repo} (${project.branch})`
        : "Sin proyecto";
    }

    async function loadProject() {
      const id = currentId;
      project = null;
      renderProject();
      try {
        const res = await fetch(`/api/conversations/${id}/project`);
        if (res.status === 401) return showLogin();
        if (!res.ok || id !== currentId) return;
        const data = await res.json();
        project = data.repo ? data : null;
        renderProject();
      } catch {}
    }

    $("proj-toggle").addEventListener("click", () => {
      const panel = $("proj-panel");
      panel.classList.toggle("hidden");
      if (!panel.classList.contains("hidden")) {
        $("proj-repo").value = project?.repo || "";
        $("proj-branch").value = project?.branch || "main";
        $("proj-token").value = "";
        $("proj-msg").textContent = "";
        $("proj-repo").focus();
      }
    });

    $("proj-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("proj-msg");
      msg.textContent = "Comprobando acceso…";
      try {
        const res = await fetch(`/api/conversations/${currentId}/project`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            repo: $("proj-repo").value.trim(),
            branch: $("proj-branch").value.trim() || "main",
            token: $("proj-token").value.trim(),
          }),
        });
        if (res.status === 401) return showLogin();
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          msg.textContent = data.error || "No se pudo vincular";
          return;
        }
        project = { repo: data.repo, branch: data.branch };
        renderProject();
        $("proj-token").value = "";
        msg.textContent = "✅ Proyecto vinculado";
      } catch {
        msg.textContent = "No se pudo conectar con el servidor";
      }
    });

    $("proj-unlink").addEventListener("click", async () => {
      if (!project) {
        $("proj-msg").textContent = "Esta conversación no tiene proyecto.";
        return;
      }
      if (!confirm("¿Desvincular el proyecto? Se borra el token guardado.")) return;
      try {
        await fetch(`/api/conversations/${currentId}/project`, { method: "DELETE" });
        project = null;
        renderProject();
        $("proj-repo").value = "";
        $("proj-token").value = "";
        $("proj-msg").textContent = "Proyecto desvinculado";
      } catch {
        $("proj-msg").textContent = "No se pudo desvincular";
      }
    });

    // --- Lista de conversaciones guardadas ---
    async function loadList() {
      try {
        const res = await fetch("/api/conversations");
        if (res.status === 401) return showLogin();
        const items = await res.json();
        const list = $("list");
        list.innerHTML = "";
        if (!items.length) {
          list.innerHTML = '<p class="list-empty">Aún no hay conversaciones guardadas.</p>';
          return;
        }
        for (const c of items) {
          const row = document.createElement("div");
          row.className = "item" + (c.id === currentId ? " active" : "");
          const t = document.createElement("span");
          t.className = "t";
          t.textContent = c.title;
          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "🗑";
          del.title = "Borrar";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteConversation(c.id);
          });
          row.addEventListener("click", () => openConversation(c.id));
          row.append(t, del);
          list.appendChild(row);
        }
      } catch {}
    }

    async function openConversation(id) {
      if (busy) return;
      try {
        const res = await fetch("/api/conversations/" + id);
        if (res.status === 401) return showLogin();
        if (!res.ok) return;
        const data = await res.json();
        currentId = data.id;
        history = data.messages;
        pending = [];
        renderPreviews();
        messagesEl.innerHTML = "";
        for (const m of history) addBubble(m.role, m.content);
        $("side").classList.remove("open");
        $("proj-panel").classList.add("hidden");
        loadList();
        loadProject();
        input.focus();
      } catch {}
    }

    async function deleteConversation(id) {
      if (busy) return;
      if (!confirm("¿Borrar esta conversación? No se puede deshacer.")) return;
      await fetch("/api/conversations/" + id, { method: "DELETE" });
      if (id === currentId) resetChat();
      loadList();
    }

    function resetChat() {
      history = [];
      pending = [];
      currentId = crypto.randomUUID();
      renderPreviews();
      messagesEl.innerHTML = '<p class="empty" id="empty">Escribe un mensaje para empezar.</p>';
      $("side").classList.remove("open");
      $("proj-panel").classList.add("hidden");
      loadList();
      loadProject();
      input.focus();
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      $("new-chat").disabled = value;
      updateLimitWarning();
    }

    // --- Aviso cuando el historial se acerca a los límites del servidor ---
    // Es una estimación: el servidor cuenta lo mismo que ve el navegador (mensajes, caracteres, imágenes)
    function updateLimitWarning() {
      const MAX_MSGS = 100;
      const MAX_CHARS = 200000;
      const box = $("limit-warn");
      let chars = 0;
      for (const m of history) {
        if (typeof m.content === "string") {
          chars += m.content.length;
        } else if (Array.isArray(m.content)) {
          for (const b of m.content) if (b.type === "text") chars += b.text.length;
        }
      }
      const imgs = countImages(history) + pending.length;
      const ratio = Math.max(history.length / MAX_MSGS, chars / MAX_CHARS, imgs / MAX_IMAGES);

      if (ratio < 0.8) {
        box.classList.add("hidden");
        return;
      }
      box.classList.remove("hidden");
      box.classList.toggle("danger", ratio >= 0.95);
      box.innerHTML = "";
      const txt = document.createElement("span");
      txt.textContent =
        `${ratio >= 0.95 ? "🚫 Límite casi alcanzado" : "⚠️ Conversación larga"}: ` +
        `${history.length}/${MAX_MSGS} mensajes · ${chars.toLocaleString("es")}/${MAX_CHARS.toLocaleString("es")} caracteres · ` +
        `${imgs}/${MAX_IMAGES} imágenes. Conviene abrir una nueva.`;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "secondary";
      btn.textContent = "Nueva conversación";
      btn.addEventListener("click", () => {
        if (!busy) resetChat();
      });
      box.append(txt, btn);
    }

    // --- Imágenes ---
    function renderPreviews() {
      updateLimitWarning();
      const box = $("previews");
      box.innerHTML = "";
      box.classList.toggle("hidden", pending.length === 0);
      pending.forEach((p, i) => {
        const wrap = document.createElement("div");
        wrap.className = "prev";
        const img = document.createElement("img");
        img.src = `data:${p.media_type};base64,${p.data}`;
        const x = document.createElement("button");
        x.type = "button";
        x.textContent = "✕";
        x.addEventListener("click", () => {
          pending.splice(i, 1);
          renderPreviews();
        });
        wrap.append(img, x);
        box.appendChild(wrap);
      });
    }

    function readFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const [head, data] = String(reader.result).split(",");
          resolve({ media_type: head.match(/data:(.*?);/)[1], data });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    $("attach").addEventListener("click", () => $("file").click());
    $("file").addEventListener("change", async (e) => {
      for (const file of e.target.files) {
        if (countImages(history) + pending.length >= MAX_IMAGES) {
          alert(`Máximo ${MAX_IMAGES} imágenes por conversación. Empieza una conversación nueva para más.`);
          break;
        }
        if (file.size > MAX_FILE_BYTES) {
          alert(`"${file.name}" supera 5 MB.`);
          continue;
        }
        pending.push(await readFile(file));
      }
      e.target.value = "";
      renderPreviews();
    });

    // --- Inicio: comprobar si ya hay sesión ---
    fetch("/api/session")
      .then((r) => r.json())
      .then((data) => (data.authenticated ? showChat() : showLogin()))
      .catch(showLogin);

    // --- Contraseña ---
    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("login-error").textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: $("password").value }),
        });
        if (res.ok) return showChat();
        const data = await res.json().catch(() => ({}));
        $("login-error").textContent = data.error || "Error al entrar";
      } catch {
        $("login-error").textContent = "No se pudo conectar con el servidor";
      }
    });

    $("logout").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      resetChat();
      showLogin();
    });

    $("new-chat").addEventListener("click", resetChat);
    $("toggle-list").addEventListener("click", () => $("side").classList.toggle("open"));

    // --- Caja de texto ---
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $("composer").requestSubmit();
      }
    });

    // --- Confirmación de commits: tarjeta para aprobar o rechazar lo que quiere hacer la IA ---
    function showConfirm(ev) {
      const card = document.createElement("div");
      card.className = "confirm-card";

      const title = document.createElement("strong");
      title.textContent = (ev.tool === "github_editar" ? "✏️ Editar " : "💾 Guardar ") + (ev.path || "");
      const commit = document.createElement("div");
      commit.className = "confirm-commit";
      commit.textContent = "Commit: " + (ev.commit || "");
      card.append(title, commit);

      const addBlock = (label, text) => {
        if (!text) return;
        const l = document.createElement("div");
        l.className = "confirm-label";
        l.textContent = label;
        const pre = document.createElement("pre");
        pre.textContent = text;
        card.append(l, pre);
      };
      if (ev.tool === "github_editar") {
        addBlock("Reemplaza:", ev.buscar);
        addBlock("Por:", ev.reemplazar);
      } else {
        addBlock("Contenido (primeros 3000 caracteres):", ev.content);
      }

      const actions = document.createElement("div");
      actions.className = "confirm-actions";
      const ok = document.createElement("button");
      ok.type = "button";
      ok.textContent = "Aprobar";
      const no = document.createElement("button");
      no.type = "button";
      no.className = "secondary";
      no.textContent = "Rechazar";
      const status = document.createElement("span");
      status.className = "confirm-status";
      actions.append(ok, no, status);
      card.appendChild(actions);

      const respond = async (approve) => {
        ok.disabled = true;
        no.disabled = true;
        try {
          const res = await fetch("/api/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: ev.id, approve }),
          });
          if (res.status === 401) return showLogin();
          status.textContent = res.ok
            ? approve ? "✅ Aprobado" : "❌ Rechazado"
            : "⚠️ La solicitud ya caducó";
        } catch {
          status.textContent = "⚠️ No se pudo enviar la respuesta";
        }
      };
      ok.addEventListener("click", () => respond(true));
      no.addEventListener("click", () => respond(false));

      messagesEl.appendChild(card);
      scrollToBottom();
    }

    // --- Enviar mensaje y mostrar la respuesta en vivo ---
    $("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy) return;
      const text = input.value.trim();
      if (!text && pending.length === 0) return;

      const sentImages = pending;
      const blocks = sentImages.map((p) => ({
        type: "image",
        source: { type: "base64", media_type: p.media_type, data: p.data },
      }));
      if (text) blocks.push({ type: "text", text });
      const content = blocks.length === 1 && blocks[0].type === "text" ? text : blocks;

      history.push({ role: "user", content });
      const userBubble = addBubble("user", content);
      input.value = "";
      input.style.height = "auto";
      pending = [];
      renderPreviews();
      setBusy(true);

      const bubble = addBubble("assistant", "");
      bubble.classList.add("typing");
      let answer = "";
      let gotDone = false;
      let errorText = "";
      let unauthorized = false;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: currentId, model, messages: history, canConfirm: true }),
        });
        if (res.status === 401) {
          unauthorized = true;
          throw new Error("Tu sesión expiró. Vuelve a entrar.");
        }
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.error || "Error del servidor");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        const handle = (line) => {
          if (!line.trim()) return;
          let ev;
          try { ev = JSON.parse(line); } catch { return; }
          if (ev.type === "text") {
            answer += ev.text;
            bubble.textContent = answer;
            scrollToBottom();
          } else if (ev.type === "confirm") {
            showConfirm(ev);
          } else if (ev.type === "error") {
            errorText = ev.error;
          } else if (ev.type === "done") {
            gotDone = true;
          }
        };
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          lines.forEach(handle);
        }
        handle(buf);
      } catch (err) {
        errorText = errorText || err.message || "Error al contactar con la IA.";
      }

      bubble.classList.remove("typing");

      if (gotDone && answer) {
        // El servidor guardó la conversación: el historial local queda igual que el guardado
        history.push({ role: "assistant", content: answer });
        if (errorText) addBubble("error-msg", errorText);
      } else {
        // No se guardó en el servidor: deshacer y devolver el mensaje a la caja
        history.pop();
        userBubble.remove();
        bubble.remove();
        input.value = text;
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
        pending = sentImages;
        renderPreviews();
        addBubble(
          "error-msg",
          (errorText || "La IA no devolvió respuesta.") + " Tu mensaje no se guardó, puedes reenviarlo."
        );
        if (unauthorized) showLogin();
      }

      setBusy(false);
      loadList();
      input.focus();
    });
  </script>
</body>
</html>
